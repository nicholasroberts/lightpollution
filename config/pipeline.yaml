project:
  name: lightpollution
  description: European VIIRS night-time radiance analysis at NUTS3 level

paths:
  viirs_raw: data/raw/viirs
  nuts_raw: data/raw/nuts
  eurostat_raw: data/raw/eurostat
  processed: data/processed
  figures: figures

viirs:
  product: annual_vnl_v2_2
  variable: average_masked_radiance
  units: "nW cm-2 sr-1"
  raster_pattern: "*average_masked*.tif"
  available_year_start: 2012
  display:
    europe_bounds_4326: [-25.0, 34.0, 36.0, 72.5]
    max_pixels_across: 2200
    radiance_percentile: 99.7
    symlog_linthresh: 0.2

nuts:
  level: 3
  crs: EPSG:4326
  resolution: 01M
  id_field: NUTS_ID
  filename_template: "NUTS_RG_01M_{release}_4326_LEVL_3.geojson"
  # Geography follows the NUTS coding used by the current Eurostat
  # DEMO_R_D3DENS population-density time series, including retrospective
  # recoding of historical observations onto later NUTS classifications.
  releases:
    - 2016
    - 2021
    - 2024
  release_by_year:
    2013: 2016
    2014: 2016
    2015: 2016
    2016: 2016
    2017: 2016
    2018: 2016
    2019: 2016
    2020: 2016
    2021: 2021
    2022: 2021
    2023: 2024
    2024: 2024

population:
  provider: Eurostat
  dataset: DEMO_R_D3DENS
  geo_level: nuts3
  frequency: A
  api_geo_level: nuts3
  expected_units: "persons per square kilometre"
  fallback_population_dataset: demo_r_pjanaggr3
  fallback_area_dataset: reg_area3
  fallback_area_measure: total_land_area
  # Only use validated fallback countries in production.
  fallback_recovery_countries:
    - BE
    - EE
    - HR
    - IT
    - NL

socioeconomic:
  provider: Eurostat
  gdp_dataset: nama_10r_3gdp
  area_dataset: reg_area3
  frequency: A
  model_gdp_metric: gdp_per_capita_pps
  gdp_units:
    gdp_total_eur_million: MIO_EUR
    gdp_total_pps_million: MIO_PPS_EU27_2020
    gdp_per_capita_eur: EUR_HAB
    gdp_per_capita_pps: PPS_EU27_2020_HAB
    gdp_per_capita_pps_index_eu27: PPS_HAB_EU27_2020

calibration:
  enabled: true
  method: country_additive_dark_regions
  dark_fraction: 0.20
  apply_from_year: 2017
  estimation_years: [2015, 2016, 2017, 2018]
  countries:
    - DE
    - IT
    - NL
    - FR
    - ES

analysis:
  first_year: 2013
  last_year: 2024
  fixed_geography: false
  year_specific_nuts: true
  geography_basis: eurostat_population_harmonized_nuts
  comparison_countries:
    - DE
    - IT
    - NL
    - FR
    - ES
  radiance_statistics:
    - weighted_mean
  iss_spectral_validation:
    raw_dir: data/raw/iss_spectral
    source_doi: 10.5281/zenodo.7677478
    article_doi: 10.1126/sciadv.abl6891
    pre_period: "2012-2013"
    post_period: "2014-2020"
    colour_metrics: [B_over_G, G_over_R]
    nuts_release: 2016
    viirs_mask_threshold: 0.5
    spatial_support: paired_common_pre_post
    spectral_change_summary: median_of_paired_pixel_differences
    viirs_mask_pre_year: 2013
    viirs_mask_post_year: 2020
    endpoint_pre_year: 2013
    endpoint_post_year: 2020
    min_valid_pixels_nuts3: 20
    reference_log10_population_density: 2.0
    paper_countries:
      - AL
      - AT
      - BE
      - BA
      - BG
      - HR
      - CZ
      - FR
      - DE
      - EL
      - HU
      - IE
      - IT
      - LT
      - LU
      - ME
      - NL
      - PL
      - PT
      - RO
      - RS
      - SK
      - SI
      - ES
      - CH
      - UK
  led_spectral_plateau:
    # Bounded spectral endpoint scenarios, not forecasts of universal CCT.
    led_cct_scenarios_k: [2700, 3000, 4000, 5000]
    led_cct_labels:
      "2700": warm_LED_2700K
      "3000": warm_LED_3000K
      "4000": neutral_LED_4000K
      "5000": cool_LED_5000K
    # Approximate HPS-like warm legacy reference for the spectral-only
    # endpoint comparison. Country forecasts use their own ISS post-period G/R.
    legacy_reference_cct_k: 2200

  density_temporal_change:
    first_year: 2013
    last_year: 2024
    min_repeated_years: 3
    min_country_regions: 3
    density_band_breaks: [30, 100, 300, 1000]
    density_band_labels: ["<30", "30-100", "100-300", "300-1000", ">=1000"]
    continuous_density_quantiles: [0.01, 0.99]
    continuous_grid_points: 120

  density_country_decomposition:
    metric: likelihood_ratio_block_reduction
    reference_surface: linear_log_population_x_year
    alternative_surface: cubic_log_population_with_density_dependent_year
    country_blocks:
      - country_year
      - country_density
      - country_rotation

  density_demographic_surface:
    horizon_years: 5
    # First pass uses only windows wholly inside NUTS 2016 geography.
    start_years: [2013, 2014, 2015]
    nuts_release: 2016
    min_country_regions: 3
    population_change_trim_quantiles: [0.005, 0.995]
    population_change_scenarios_pct_per_year: [-2, -1, 0, 1, 2]
    reference_population_densities: [10, 30, 50, 100, 300, 1000, 3000]
    surface_density_quantiles: [0.01, 0.99]
    surface_population_change_quantiles: [0.01, 0.99]
    surface_density_points: 80
    surface_population_change_points: 81

  socioeconomic_model:
    alpha: 0.05
    min_country_regions: 3
    last_year: 2023
    selection_method: crawley_top_down_likelihood_ratio
    maximal_interaction_order: 3
    maximal_fixed_effects: "all main effects + all 2-way + all 3-way interactions; no 4-way interaction"
    random_intercept: NUTS_ID
  mixed_model:
    min_country_regions: 3
    random_intercept: NUTS_ID
    year_effect: numeric_centered
    country_effect: fixed
    include_country_density_interaction: true
    include_country_year_interaction: true
  europe_maps:
    extent_4326: [-25.0, 34.0, 45.0, 72.5]
    projection: EPSG:3035
    cmap: inferno
    colour_min_quantile: 0.01
    colour_max_quantile: 0.99
    dpi: 600
  area_weighting:
    enabled: true
    method: exact_overlap_area_spherical_m2
    candidate_method: area_spherical_m2
    validation:
      year: 2024
      sample_size: 9
      output_csv: zonal_weighting_validation_{year}.csv
      output_figure: zonal_weighting_validation_{year}.pdf

outputs:
  radiance_by_nuts3: nuts3_viirs_radiance.parquet
  radiance_by_nuts3_calibrated: nuts3_viirs_radiance_calibrated.parquet
  calibration_offsets: viirs_country_calibration_offsets.csv
  population_by_nuts3: nuts3_population_density.parquet
  socioeconomic_by_nuts3: nuts3_socioeconomic.parquet
  merged: nuts3_radiance_population.parquet
  merged_socioeconomic: nuts3_radiance_population_socioeconomic.parquet
  csv_export: nuts3_radiance_population.csv
